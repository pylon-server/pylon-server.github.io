<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="app-template" content="1.1.0">
  <title>Fish Market — pylon-server</title>
  <script src="/pylon-config.js"></script><script>window.PYLON_FRONTEND_PROFILE="fish";</script><script src="/appui/src/foundation/frontend-auth.js"></script><script src="/appui/loader.js"></script>
  <script>AppUIAssets.loadCss();</script>
  <link rel="stylesheet" href="assets/fish.css?v=3">
</head>
<body data-auto-init="false" data-page-id="personal-fish" data-page-title="Fish Market">
  <nav id="app-menubar" class="ai-app-menu" aria-label="Application menu"></nav>
  <div id="app-main" class="ai-app-main">
    <aside id="app-left" class="ai-app-left" aria-label="Left sidebar"></aside>
    <main id="app-content" class="ai-app-content content-layout" aria-label="Application content">
      <div id="app-content-top" class="content-top"></div>
      <div id="app-content-body" class="content-body"></div>
      <div id="app-content-bottom" class="content-bottom"></div>
    </main>
    <aside id="app-right" class="ai-app-right" aria-label="Right sidebar"></aside>
  </div>
  <footer id="app-statusbar" class="ai-app-status" aria-label="Application status"></footer>
  <script>
    window.APPUI_BUNDLES = window.APPUI_BUNDLES || {};
    ['foundation','shell','toolbar','collections','dataTable'].forEach(function (b) {
      window.APPUI_BUNDLES[b] = '/appui/bundle/' + b + '.js';
    });
    window.AppUIReady = AppUIAssets.load('foundation', 'shell', 'toolbar', 'collections', 'dataTable');
  </script>
  <script>window.PYLON_NATIVE_APP={script:"assets/fish.js"};</script><script src="/appui/src/foundation/native-static.js"></script>
</body>
</html>
